"$schema" = 'https://starship.rs/config-schema.json'  # 配置文件的語法校驗地址

format = """  # 提示符的完整佈局，定義各模塊的顯示順序和樣式
[](red)\
$os\
$username\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
[](fg:yellow bg:green)\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:green bg:sapphire)\
$conda\
[](fg:sapphire bg:lavender)\
$time\
[ ](fg:lavender)\
$cmd_duration\
$character"""

palette = 'catppuccin_mocha'  # 當前使用的 Catppuccin Mocha 配色方案

[os]  # 操作系統圖標
disabled = false
style = "bg:red fg:crust"

[os.symbols]  # 各操作系統對應的 Nerd Font 圖標
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]  # 當前用戶名顯示
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user]($style)'

[directory]  # 當前工作目錄
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3  # 路徑超過 3 層後開始縮短
truncation_symbol = "…/"  # 縮短時顯示的符號

[directory.substitutions]  # 常用目錄的名稱替換
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]  # Git 分支名稱
symbol = ""  # 分支圖標
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[git_status]  # Git 工作區狀態（修改、暫存、領先/落後等）
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

[nodejs]  # Node.js 版本
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[bun]  # Bun 運行時版本
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[c]  # C 語言環境
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[rust]  # Rust 工具鏈版本
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[golang]  # Go 語言版本
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[php]  # PHP 版本
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[java]  # Java 版本
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[kotlin]  # Kotlin 版本
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[haskell]  # Haskell 版本
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[python]  # Python 虛擬環境及版本
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'

[docker_context]  # Docker 上下文
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $context) ](fg:crust bg:sapphire)]($style)'

[conda]  # Conda 環境
symbol = "  "
style = "fg:crust bg:sapphire"
format = '[$symbol$environment ]($style)'
ignore_base = false  # 是否忽略 base 環境

[time]  # 當前時間
disabled = false
time_format = "%R"  # 24 小時制，如 "14:30"
style = "bg:lavender"
format = '[[  $time ](fg:crust bg:lavender)]($style)'

[character]  # 命令輸入前的提示符號（普通 Shell）
disabled = false
success_symbol = '[❯](bold fg:green)'  # 上條命令成功時的符號
error_symbol = '[❯](bold fg:red)'  # 上條命令失敗時的符號

[vimcmd]  # Vim/Neovim 模式下的提示符號（取代舊版 [character] 中的 vimcmd_*）
normal_symbol = '[❮](bold fg:green)'  # 普通模式的符號
visual_symbol = '[❮](bold fg:yellow)'  # 可視模式的符號
replace_symbol = '[❮](bold fg:lavender)'  # 替換模式的符號
replace_one_symbol = '[❮](bold fg:lavender)'  # 單次替換模式的符號

[cmd_duration]  # 命令執行耗時
show_milliseconds = true  # 顯示毫秒
format = " in $duration "
style = "bg:lavender"
disabled = false
show_notifications = true  # 對耗時過長命令發送系統通知
min_time_to_notify = 45000  # 觸發通知的最小耗時（毫秒）

