"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 1000

format = """
[](red)\
$os\
$username\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
[](fg:yellow bg:blue)\
$c\
[](fg:blue bg:sapphire)\
$cpp\
[](fg:sapphire bg:maroon)\
$rust\
[](fg:maroon bg:peach)\
$swift\
[](fg:peach bg:blue)\
$lua\
[](fg:blue bg:yellow)\
$zig\
[](fg:yellow bg:mauve)\
$dotnet\
[](fg:mauve bg:sky)\
$golang\
[](fg:sky bg:red)\
$java\
[](fg:red bg:sapphire)\
$python\
[](fg:sapphire bg:peach)\
$lisp\
[](fg:peach bg:maroon)\
$common_lisp\
[](fg:maroon bg:red)\
$scheme\
[](fg:red bg:green)\
$nodejs\
[](fg:green bg:peach)\
$bun\
[](fg:peach bg:lavender)\
$php\
[](fg:lavender bg:pink)\
$kotlin\
[](fg:pink bg:mauve)\
$haskell\
[](fg:mauve bg:sky)\
$cryengine\
[](fg:sky bg:blue)\
$unreal\
[](fg:blue bg:red)\
$bevy\
[](fg:red bg:sapphire)\
$godot\
[](fg:sapphire bg:lavender)\
$unity\
[](fg:lavender bg:sapphire)\
$docker_context\
$conda\
[](fg:sapphire bg:lavender)\
$time\
[ ](fg:lavender)\
$cmd_duration\
$character"""

palette = 'catppuccin_mocha'

[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
Macos = "󰀵"
FreeBSD = ""
OpenBSD = ""
NetBSD = ""
DragonFly = ""
Illumos = ""
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Fedora = "󰣛"
Gentoo = "󰣨"
Linux = "󰌽"
Manjaro = ""
Mint = "󰣭"
Raspbian = "󰐿"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
SUSE = ""
Ubuntu = "󰕈"
Windows = ""

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user]($style)'

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

[c]
symbol = " "
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:crust bg:blue)]($style)'

[cpp]
symbol = " "
style = "bg:sapphire"
format = '[[ $symbol( $version) ](fg:crust bg:sapphire)]($style)'

[rust]
symbol = ""
style = "bg:maroon"
format = '[[ $symbol( $version) ](fg:crust bg:maroon)]($style)'

[swift]
symbol = ""
style = "bg:peach"
format = '[[ $symbol( $version) ](fg:crust bg:peach)]($style)'

[lua]
symbol = " "
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:crust bg:blue)]($style)'

[zig]
symbol = " "
style = "bg:yellow"
format = '[[ $symbol( $version) ](fg:crust bg:yellow)]($style)'

[dotnet]
symbol = " "
style = "bg:mauve"
format = '[[ $symbol( $version) ](fg:crust bg:mauve)]($style)'

[golang]
symbol = ""
style = "bg:sky"
format = '[[ $symbol( $version) ](fg:crust bg:sky)]($style)'

[java]
symbol = " "
style = "bg:red"
format = '[[ $symbol( $version) ](fg:crust bg:red)]($style)'

[python]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:sapphire)]($style)'

[custom.lisp]
command = 'gcl --version 2>/dev/null | head -1 || clisp --version 2>/dev/null | head -1 || ecl --version 2>/dev/null | head -1'
when = 'which gcl > /dev/null 2>&1 || which clisp > /dev/null 2>&1 || which ecl > /dev/null 2>&1'
symbol = " "
style = "bg:peach"
format = '[[ $symbol( $output) ](fg:crust bg:peach)]($style)'

[custom.common_lisp]
command = 'sbcl --version 2>&1 | head -1'
when = 'which sbcl > /dev/null 2>&1'
symbol = " "
style = "bg:maroon"
format = '[[ $symbol CL( $output) ](fg:crust bg:maroon)]($style)'

[custom.scheme]
command = 'guile --version 2>/dev/null | head -1 || chicken -version 2>/dev/null | head -1 || mit-scheme --version 2>/dev/null | head -1'
when = 'which guile > /dev/null 2>&1 || which chicken > /dev/null 2>&1 || which mit-scheme > /dev/null 2>&1'
symbol = "λ "
style = "bg:red"
format = '[[ $symbol( $output) ](fg:crust bg:red)]($style)'

[nodejs]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[bun]
symbol = ""
style = "bg:peach"
format = '[[ $symbol( $version) ](fg:crust bg:peach)]($style)'

[php]
symbol = ""
style = "bg:lavender"
format = '[[ $symbol( $version) ](fg:crust bg:lavender)]($style)'

[kotlin]
symbol = ""
style = "bg:pink"
format = '[[ $symbol( $version) ](fg:crust bg:pink)]($style)'

[haskell]
symbol = ""
style = "bg:mauve"
format = '[[ $symbol( $version) ](fg:crust bg:mauve)]($style)'

[custom.cryengine]
command = 'ls *.cryproject 2>/dev/null | head -1'
when = 'ls *.cryproject >/dev/null 2>&1'
symbol = "󰑺 "
style = "bg:sky"
format = '[[ $symbol CryEngine ](fg:crust bg:sky)]($style)'

[custom.unreal]
command = 'head -1 Engine/Build/Build.version 2>/dev/null'
when = 'test -f Engine/Build/Build.version'
symbol = "󰲋 "
style = "bg:blue"
format = '[[ $symbol Unreal( $output) ](fg:crust bg:blue)]($style)'

[custom.bevy]
command = 'grep bevy Cargo.toml 2>/dev/null | head -1'
when = 'test -f Cargo.toml && grep -q bevy Cargo.toml 2>/dev/null'
symbol = " "
style = "bg:red"
format = '[[ $symbol Bevy( $output) ](fg:crust bg:red)]($style)'

[custom.godot]
command = 'head -1 project.godot 2>/dev/null'
when = 'test -f project.godot'
symbol = " "
style = "bg:sapphire"
format = '[[ $symbol Godot( $output) ](fg:crust bg:sapphire)]($style)'

[custom.unity]
command = 'head -1 ProjectSettings/ProjectVersion.txt 2>/dev/null'
when = 'test -f ProjectSettings/ProjectVersion.txt'
symbol = "󰖐 "
style = "bg:lavender"
format = '[[ $symbol Unity( $output) ](fg:crust bg:lavender)]($style)'

[docker_context]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $context) ](fg:crust bg:sapphire)]($style)'

[conda]
symbol = "  "
style = "fg:crust bg:sapphire"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:lavender"
format = '[[  $time ](fg:crust bg:lavender)]($style)'

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:lavender"
disabled = false
show_notifications = true
min_time_to_notify = 45000

