# 將前綴鍵改為 Ctrl+a（可選，很多人覺得更順手）
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 啟用鼠標支持（點擊切換窗格、拖拽調整大小）
set -g mouse on

# ---- 修改：解決快捷鍵衝突 ----
# 調整窗格大小的快捷鍵（將 Ctrl 替換為 Alt，避免與窗格導航衝突）
bind -r M-h resize-pane -L 5   # 前綴 M-h 向左縮小窗格
bind -r M-j resize-pane -D 5   # 前綴 M-j 向下增大窗格
bind -r M-k resize-pane -U 5   # 前綴 M-k 向上增大窗格
bind -r M-l resize-pane -R 5   # 前綴 M-l 向右增大窗格

# 更方便的窗格切換（使用 Ctrl+方向鍵）
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D

# 重新加載配置文件
bind r source-file ~/.tmux.conf \; display "配置已重新加載"

# 配置插件
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
run '~/.tmux/plugins/tpm/tpm'

# 配置自動保存
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ---- 新增：保存並恢復正在運行的程序狀態 ----
set -g @resurrect-processes 'vim nvim htop btop ssh'

# 狀態欄美化
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[fg=#f5c2e7] #S "
set -g status-right "#[fg=#a6e3a1] %H:%M:%S #[fg=#89b4fa] %Y-%m-%d "
