set -g default-terminal "tmux-256color"
set -g allow-passthrough on
set -ga update-environment LANG
set -ga update-environment LC_ALL

# 插件列表
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# 自動保存（每15分鐘）
set -g @continuum-save-interval '15'

# 開機自動恢復
set -g @continuum-restore 'on'

# 初始化插件管理器（必須放在最後）
run '~/.tmux/plugins/tpm/tpm'
run "~/.tmux/plugins/tmux-resurrect/resurrect.tmux"

# ===== 手動保存與恢復會話 =====

# 按 Ctrl+b 然後按 Ctrl+s 保存會話
bind C-s run-shell '~/.tmux/plugins/tmux-resurrect/scripts/save.sh'

# 按 Ctrl+b 然後按 Ctrl+r 恢復會話
bind C-r run-shell '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh'
