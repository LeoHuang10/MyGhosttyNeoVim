# 將前綴鍵改為 Ctrl+a（可選，很多人覺得更順手）
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 啟用鼠標支持（點擊切換窗格、拖拽調整大小）
set -g mouse on

# 調整窗格大小的快捷鍵（無需進入命令模式）
bind -r C-h resize-pane -L 5   # Ctrl+a C-h 向左縮小
bind -r C-j resize-pane -D 5   # Ctrl+a C-j 向下增大
bind -r C-k resize-pane -U 5   # Ctrl+a C-k 向上增大
bind -r C-l resize-pane -R 5   # Ctrl+a C-l 向右增大

# 更方便的窗格切換（使用 Ctrl+方向鍵）
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D

# 重新加載配置文件
bind r source-file ~/.tmux.conf \; display "配置已重新加載"

# 配置插件
set -g @plugin 'tmux-plugins/tpm'                           # TPM 本身
set -g @plugin 'tmux-plugins/tmux-resurrect'                # 手動保存與恢復會話
set -g @plugin 'tmux-plugins/tmux-continuum'                # 自動定時保存，啟動時恢復
set -g @plugin 'tmux-plugins/tmux-yank'                     # 整合系統剪貼板
set -g @plugin 'christoomey/vim-tmux-navigator'             # 與 Neovim 無縫導航
run '~/.tmux/plugins/tpm/tpm'                               # 載入 TPM

# 配置自動保存
set -g @continuum-restore 'on'          # 啟動時自動恢復會話
set -g @continuum-save-interval '15'    # 每 15 分鐘自動保存

# 狀態欄美化
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"                          # 整體背景與前景色
set -g status-left "#[fg=#f5c2e7] #S "                               # 左側顯示會話名
set -g status-right "#[fg=#a6e3a1] %H:%M:%S #[fg=#89b4fa] %Y-%m-%d " # 右側顯示時間
